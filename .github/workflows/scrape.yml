name: Daily price scrape

on:
  schedule:
    - cron: '0 23 * * *'  # 9 AM AEST (UTC+10)
  workflow_dispatch:       # allow manual trigger from GitHub Actions tab

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: backend
        run: npx playwright install chromium --with-deps

      - name: Initialise local database
        working-directory: backend
        # Schema only, deliberately no seed step — the product/retailer-URL list for scraping
        # now comes from the live backend (see fetch-backend-rows.ts). This just creates empty
        # tables so the scrapers' local 12h-cache-check query doesn't error on a missing table;
        # that check is always a no-op here anyway since the table starts empty every run.
        run: node --import tsx/esm src/db/init.ts

      - name: Run scrapers and push to Render
        working-directory: backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node --import tsx/esm src/scrapers/run-and-push.ts
