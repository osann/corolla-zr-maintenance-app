name: Supercheap Tuesday sale scrape

# Supercheap Auto runs Super Saver Tuesdays from 5 PM AEST/AEDT.
# First run captures sale prices; second run refreshes after the window closes.
#
# GitHub Actions runs in UTC. Australia/Sydney observes:
#   AEST  UTC+10  (Apr–Oct)  5:05 PM = 07:05 UTC,  11:59 PM = 13:59 UTC
#   AEDT  UTC+11  (Oct–Apr)  5:05 PM = 06:05 UTC,  11:59 PM = 12:59 UTC
#
# Both pairs are scheduled so the correct run always fires regardless of DST.
# The off-season pair fires an hour off-target but is harmless — prices are
# still pushed and the frontend reflects the latest scraped data.

on:
  schedule:
    - cron: '5 6 * * 2'   # 5:05 PM AEDT (UTC+11) — sale open, daylight saving
    - cron: '5 7 * * 2'   # 5:05 PM AEST (UTC+10) — sale open, standard time
    - cron: '59 12 * * 2'  # 11:59 PM AEDT (UTC+11) — refresh, daylight saving
    - cron: '59 13 * * 2'  # 11:59 PM AEST (UTC+10) — refresh, standard time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: backend
        run: npx playwright install chromium --with-deps

      - name: Initialise local database
        working-directory: backend
        run: |
          node --import tsx/esm src/db/init.ts
          node --import tsx/esm src/db/seed.ts

      - name: Scrape Supercheap and push to Render
        working-directory: backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node --import tsx/esm src/scrapers/run-supercheap.ts
