name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Only the frontend files are published — uploading the repo root would also serve
      # backend source, docs, and local config files publicly.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html styles.css CNAME js _site/

      - name: Inject backend URL and build date
        run: |
          sed -i "s|__BACKEND_URL__|${{ secrets.BACKEND_URL }}|g" _site/js/config.js
          sed -i "s|__BUILD_DATE__|$(date +'%-d %B %Y')|g" _site/js/config.js
          # Fail the deploy rather than ship an unsubstituted placeholder.
          if grep -q "__BACKEND_URL__\|__BUILD_DATE__" _site/js/config.js; then
            echo "::error::placeholder not substituted in js/config.js"; exit 1
          fi

      # Stamp every module URL with the commit so a deploy is atomic: without it, a browser could
      # combine cached old modules with new ones. Every specifier is rewritten identically, so
      # each module (notably js/state.js) still loads exactly once.
      - name: Version module URLs
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s|from '\./\([a-z]*\)\.js'|from './\1.js?v=$v'|g" _site/js/*.js
          sed -i "s|src=\"js/main\.js\"|src=\"js/main.js?v=$v\"|" _site/index.html
          grep -q "js/main.js?v=$v" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
