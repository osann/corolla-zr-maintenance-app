name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Only the frontend files are published — uploading the repo root would also serve
      # backend source, docs, and local config files publicly.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html app.js styles.css CNAME _site/

      - name: Inject backend URL and build date
        run: |
          sed -i "s|__BACKEND_URL__|${{ secrets.BACKEND_URL }}|g" _site/app.js
          sed -i "s|__BUILD_DATE__|$(date +'%-d %B %Y')|g" _site/app.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
