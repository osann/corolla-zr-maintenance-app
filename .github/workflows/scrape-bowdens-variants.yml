name: Bowden's Own variant scrape

# Scrapes Bowden's variant products with real Playwright browser interaction, then
# pushes observations to Render. Plain-fetch Neto requests can receive HTTP 403 from
# GitHub Actions runner IPs.

on:
  schedule:
    - cron: '0 22 * * *'  # 8 AM AEST (UTC+10) — 1 hour before the Render Bowden's cron
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright browser
        working-directory: backend
        run: npx playwright install chromium --with-deps

      - name: Scrape Bowden's variants and push to Render
        working-directory: backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node --import tsx/esm src/scrapers/run-bowdens-variants.ts
