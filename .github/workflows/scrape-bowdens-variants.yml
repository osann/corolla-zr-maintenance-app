name: Bowden's Own variant scrape

# Scrapes Bowden's Own products that have size radio buttons, using the Maropost/Neto
# ajax_template XHR endpoint directly. The XHR endpoint bypasses Cloudflare's JS
# challenge (which only fires on full page loads), so plain fetch works from GitHub
# Actions without Playwright or proxies.

on:
  schedule:
    - cron: '0 22 * * *'  # 8 AM AEST (UTC+10) — 1 hour before the Render Bowden's cron
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Initialise local database
        working-directory: backend
        run: |
          node --import tsx/esm src/db/init.ts
          node --import tsx/esm src/db/seed.ts

      - name: Scrape Bowden's variants and push to Render
        working-directory: backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node --import tsx/esm src/scrapers/run-bowdens-variants.ts
