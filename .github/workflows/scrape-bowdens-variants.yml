name: Bowden's Own variant scrape

# Scrapes Bowden's Own products that have size radio buttons — plain fetch always
# returns the default (smallest) size price so Playwright must click the correct variant.
#
# KNOWN LIMITATION: Bowden's is behind Cloudflare, which blocks GitHub Actions datacenter
# IPs with a JS challenge ("Just a moment..."). This workflow will always fail to retrieve
# prices until run from a residential IP. A proxy service would fix it, but the added
# complexity isn't justified for a personal project. Snow Job 5L is covered by Repco.

on:
  workflow_dispatch:  # manual only — scheduled runs disabled (Cloudflare blocks GitHub Actions IPs)

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: backend
        run: npx playwright install chromium --with-deps

      - name: Initialise local database
        working-directory: backend
        run: |
          node --import tsx/esm src/db/init.ts
          node --import tsx/esm src/db/seed.ts

      - name: Scrape Bowden's variants and push to Render
        working-directory: backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node --import tsx/esm src/scrapers/run-bowdens-variants.ts
