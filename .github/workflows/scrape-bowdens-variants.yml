name: Bowden's Own variant scrape

# Scrapes Bowden's Own products that have size radio buttons — plain fetch always
# returns the default (smallest) size price so Playwright must click the correct variant.
#
# NOTE: Bowden's blocks some cloud IPs. If runs fail with navigation timeouts or
# unexpected redirects, Bowden's may be blocking GitHub Actions IP ranges and this
# scraper will need to be moved to a different execution environment.

on:
  schedule:
    - cron: '0 22 * * *'  # 8 AM AEST (UTC+10) — 1 hour before the Render cron
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: backend
        run: npx playwright install chromium --with-deps

      - name: Initialise local database
        working-directory: backend
        run: |
          node --import tsx/esm src/db/init.ts
          node --import tsx/esm src/db/seed.ts

      - name: Scrape Bowden's variants and push to Render
        working-directory: backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node --import tsx/esm src/scrapers/run-bowdens-variants.ts
