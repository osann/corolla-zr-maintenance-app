name: Bowden's Own variant scrape

# Triggers the Render backend to scrape Bowden's variant products (size radio buttons).
# Scraping runs on Render, not here — Render's IPs are not Cloudflare-blocked by
# Bowden's, whereas GitHub Actions runner IPs receive a JS challenge on page loads and
# HTTP 403 on the Neto XHR endpoint.

on:
  schedule:
    - cron: '0 22 * * *'  # 8 AM AEST (UTC+10) — 1 hour before the Render Bowden's cron
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend scrape
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: |
          STATUS=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            -X POST "$BACKEND_URL/api/scrape/bowdens-variants" \
            -H "Authorization: Bearer $SCRAPE_SECRET")
          cat /tmp/body.txt
          [ "$STATUS" -eq 200 ] || exit 1
