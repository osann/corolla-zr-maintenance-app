name: Bowden's Own variant scrape

# Manual diagnostic only. The scheduled Bowden's variant scrape runs from the Render
# backend cron via backend/src/scrapers/index.ts. GitHub Actions runner IPs can receive
# HTTP 403 from Bowden's Maropost/Neto ajax_template endpoint.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Initialise local database
        working-directory: backend
        run: |
          node --import tsx/esm src/db/init.ts
          node --import tsx/esm src/db/seed.ts

      - name: Scrape Bowden's variants and push to Render
        working-directory: backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node --import tsx/esm src/scrapers/run-bowdens-variants.ts
