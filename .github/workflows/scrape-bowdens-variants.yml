name: Bowden's Own variant scrape

# Triggers the Render backend to scrape Bowden's variant products. GitHub Actions
# runner IPs can receive HTTP 403 from Bowden's Maropost/Neto ajax_template endpoint,
# so the workflow must not scrape Bowden's directly.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Trigger Bowden's variant scrape on Render
        working-directory: backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
        run: node --import tsx/esm src/scrapers/run-bowdens-variants.ts
